name: Regression tests
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: paulsullivan33-dev/superFetch
          path: superfetch-contract
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements.txt
      - run: python -m unittest discover -s tests -v
        env:
          SUPERFETCH_SOURCE: ${{ github.workspace }}/superfetch-contract/readAndParse.py
          FILELIST_REQUIRE_LINUX_INTEGRATION: '1'
      - run: python tools/check_superfetch.py --superfetch superfetch-contract
